<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      position: relative;
    }

    :root {
      --edge-margin: 1.5cm;
      --top-margin: 3cm;
    }

    .archive-wrapper {
      padding: var(--top-margin) var(--edge-margin) var(--edge-margin) var(--edge-margin);
    }

    @font-face {
      font-family: 'ABC Monument Grotesk Medium';
      src: url('fonts/ABCMonumentGrotesk-Medium-Trial.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'ABC Monument Grotesk Regular';
      src: url('fonts/ABCMonumentGrotesk-Regular-Trial.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    .info-section {
      margin-bottom: 2rem;
    }

    .site-name {
      font-family: 'ABC Monument Grotesk Regular', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      color: #000000;
      position: fixed;
      top: 1.5cm;
      left: var(--edge-margin);
    }

    .site-name .name-highlight {
      font-family: 'ABC Monument Grotesk Medium', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .name-highlight {
      position: relative;
      display: inline-block;
    }

    .name-highlight .letter {
      display: inline-block;
      transform-origin: 50% 55%;
      transform: translate(var(--tx, 0px), var(--ty, 0px));
    }

    .name-highlight .letter.spin {
      animation: letter-spin 0.6s ease;
    }

    @keyframes letter-spin {
      to {
        transform: translate(var(--tx, 0px), var(--ty, 0px)) rotate(360deg);
      }
    }

    .archive-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      row-gap: calc(var(--edge-margin) * 2);
      column-gap: 1.25rem;
    }

    .work-item {
      aspect-ratio: 16 / 10;
      background-color: #eaeaea;
      overflow: hidden;
    }

    .work-item img,
    .work-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .work-caption {
      margin-top: 0.75rem;
      font-family: 'ABC Monument Grotesk Regular', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #000000;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
      text-decoration: none;
      display: block;
    }

    .work-caption:hover {
      text-decoration: underline;
    }

    .work-caption p {
      margin: 0;
    }
  </style>
</head>
<body>

  <script>
    document.querySelectorAll('.name-highlight .letter').forEach((letter) => {
      let state = 'idle'; // 'idle' | 'spinning' | 'cooldown'

      letter.addEventListener('mouseenter', () => {
        if (state !== 'idle') return;
        state = 'spinning';
        letter.classList.add('spin');
      });

      letter.addEventListener('animationend', () => {
        letter.classList.remove('spin');
        state = 'cooldown';
        setTimeout(() => {
          state = 'idle';
        }, 500);
      });
    });
  </script>

  <script>
    (function () {
      const nameEl = document.querySelector('.site-name');
      const container = document.querySelector('.name-highlight');
      const letters = Array.from(container.querySelectorAll('.letter'));

      // Capture each letter's natural horizontal offset and width before taking it out of flow
      const naturalX = letters.map((el) => el.offsetLeft);
      const letterWidths = letters.map((el) => el.getBoundingClientRect().width);
      const naturalWidth = container.offsetWidth;
      const naturalHeight = container.offsetHeight;

      container.style.width = naturalWidth + 'px';
      container.style.height = naturalHeight + 'px';

      letters.forEach((el, i) => {
        el.style.position = 'absolute';
        el.style.left = naturalX[i] + 'px';
        el.style.top = '0px';
      });

      // Measure the real pixel value of the 1.5cm edge margin
      const marginProbe = document.createElement('div');
      marginProbe.style.cssText = 'position:absolute; visibility:hidden; height:0; width:var(--edge-margin);';
      document.body.appendChild(marginProbe);
      const edgeMarginPx = marginProbe.getBoundingClientRect().width;
      document.body.removeChild(marginProbe);

      const lineHeight = 22;    // vertical spacing between stacked letters
      const animDuration = 800; // ms for the transform to fully play out

      const startTop = nameEl.getBoundingClientRect().top;
      const startLeft = nameEl.getBoundingClientRect().left;
      const targetLeft = edgeMarginPx / 2; // center of the 1.5cm margin gutter

      // Final horizontal translate per letter: centers each letter on a shared vertical
      // axis (container-local x = 0) instead of left-aligning them
      const targetTx = letters.map((el, i) => -letterWidths[i] / 2 - naturalX[i]);

      let progress = 0;        // 0 = original horizontal, 1 = vertical stacked
      let targetProgress = 0;
      let animFrame = null;
      let animStartTime = null;
      let animStartProgress = 0;

      function easeOutQuint(t) {
        return 1 - Math.pow(1 - t, 5);
      }

      function render(p) {
        letters.forEach((el, i) => {
          const tx = targetTx[i] * p;
          const ty = i * lineHeight * p;
          el.style.setProperty('--tx', tx + 'px');
          el.style.setProperty('--ty', ty + 'px');
        });

        const totalVerticalHeight = lineHeight * (letters.length - 1);
        const verticalOffset = 80; // px to shift the vertical layout upward from center
        const targetTop = window.innerHeight / 2 - totalVerticalHeight / 2 - verticalOffset;
        const top = startTop + (targetTop - startTop) * p;
        const left = startLeft + (targetLeft - startLeft) * p;

        nameEl.style.top = top + 'px';
        nameEl.style.left = left + 'px';
      }

      function animateTo(target) {
        if (targetProgress === target && animFrame) return;
        targetProgress = target;
        animStartProgress = progress;
        animStartTime = null;
        if (animFrame) cancelAnimationFrame(animFrame);

        function step(timestamp) {
          if (animStartTime === null) animStartTime = timestamp;
          const elapsed = timestamp - animStartTime;
          const t = Math.min(elapsed / animDuration, 1);
          const eased = easeOutQuint(t);
          progress = animStartProgress + (targetProgress - animStartProgress) * eased;
          render(progress);

          if (t < 1) {
            animFrame = requestAnimationFrame(step);
          } else {
            progress = targetProgress;
            render(progress);
            animFrame = null;
          }
        }
        animFrame = requestAnimationFrame(step);
      }

      function onScroll() {
        const desired = window.scrollY > 0 ? 1 : 0;
        if (desired !== targetProgress) animateTo(desired);
      }

      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', () => render(progress));
      render(0);
    })();
  </script>

</body>
